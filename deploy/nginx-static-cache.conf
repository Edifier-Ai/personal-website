# Include these locations inside the summer2077.com HTTPS server block.
# CSS and JavaScript URLs carry an explicit version query, so they can be cached long term.
location ~* \.(?:css|js)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

# Image filenames are stable and may be replaced, so keep a shorter browser cache.
location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000" always;
    access_log off;
}

# Search discovery files should refresh quickly after a content release.
location = /robots.txt {
    add_header Cache-Control "public, max-age=3600" always;
}

location = /sitemap.xml {
    add_header Cache-Control "public, max-age=3600" always;
}

