server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name summer2077.com;

    root /var/www/personal-site/current;
    index index.html;

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    ssl_certificate /etc/letsencrypt/live/summer2077.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/summer2077.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.summer2077.com;

    return 301 https://summer2077.com$request_uri;

    ssl_certificate /etc/letsencrypt/live/summer2077.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/summer2077.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name summer2077.com www.summer2077.com;
    return 301 https://summer2077.com$request_uri;
}
